function makeFighter(element, tint, startPos, hpEl, charKey = 'ch24'){

              element, cd:0, busy:0, hitDone:true, mats:[], flash:0, deflectT:0, dcd:0, wcd:0, comboT:0, chainT:0, chain:0, sinceRoll:9, holdT:0, charge:0, charging:false, down:false, hitSide:false, hp:100, hpEl, prev:{}, combo:0, stun:0, iframes:0, rollDir:new THREE.Vector3() };
  f.root.position.copy(startPos); scene.add(f.root);

  f.aura.rotation.x = -Math.PI/2; f.aura.position.y = 0.03; f.aura.scale.setScalar(0.65); f.root.add(f.aura);
  f.shield = new THREE.Mesh(new THREE.CircleGeometry(1.5, 40), new THREE.MeshBasicMaterial({ color:tint, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false }));
  const rim = new THREE.Mesh(new THREE.RingGeometry(1.38, 1.55, 40), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false }));
  f.shield.add(rim); f.shield.rim = rim;

  Promise.all([parseGLB(A.characters[charKey]), masterClips()]).then(([gltf, clips]) => {

      o.castShadow = true; o.receiveShadow = false; o.frustumCulled = false;
      const conv = mt => { const c = mt.clone(); c.color.multiply(new THREE.Color(ELEMENT_TINT[element])); c.emissive = new THREE.Color(0); f.mats.push(c); return c; };
      o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
    });
    m.updateMatrixWorld(true);
    let headY = 0; const v = new THREE.Vector3();
    m.traverse(o => { if (o.isBone){ o.getWorldPosition(v); headY = Math.max(headY, v.y); } });
    const h = headY > 0.01 ? headY * 1.12 : 2.0;
    m.scale.multiplyScalar(TARGET_H / h);
    f.pivot = new THREE.Group(); f.pivot.position.y = 1.0; m.position.y -= 1.0; f.pivot.add(m); f.root.add(f.pivot);
    f.mixer = new THREE.AnimationMixer(m);
    clips.forEach(c => f.actions[c.name] = f.mixer.clipAction(c));
    ['Punch_Left','Punch_Right','Kick_Left','Kick_Right','Roll','HitRecieve','HitRecieve_2','Death','Cast','Interact','Sword_Slash','Jump','Getup'].forEach(n => {
      const a = f.actions[n]; if (a){ a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; }
    });

  }).catch(err => {
    document.getElementById('pads').textContent = 'Character failed to load: ' + (err && err.message || err);

    const trailGap = 1e9;   // no trail   // small stream shots leave a lighter trail (less lag)
    while (p.trailT > trailGap){ p.trailT -= trailGap;
      const back = p.vel.clone().normalize().multiplyScalar(-0.5);
      const j = 0.4, at = p.g.position.clone().add(back).add(new THREE.Vector3((Math.random()-0.5)*j, (Math.random()-0.5)*j, (Math.random()-0.5)*j));
      puff(at, p.e.c[1], (0.55 + Math.random()*0.35)*p.sc, (Math.random()-0.5)*1.5, p.e.rise + Math.random(), (Math.random()-0.5)*1.5, 0.32 + Math.random()*0.15, p.e.c);
    }
    if (!p.auth){ if (p.life < -1.5){ killShot(p); shots.splice(i, 1); } continue; }   // the other player's game decides what this shot hits
    let blocked = false;
    for (const w of walls){
      if (w.owner === p.owner || w.dead) continue;
      if (inWall(w, p.g.position, 0.35*p.sc)){ w.hp -= 1; w.flash = 0.1; send({ t:'wallHit', wid:w.wid }); send({ t:'shotEnd', sid:p.sid, pos:[p.g.position.x, p.g.position.y, p.g.position.z], big:false }); explode(p.g.position, p.e, false, p.sc); if (w.el !== p.owner.element) sfx.sizzle(); blocked = true; break; }
    }
    if (blocked){ scene.remove(p.g); p.body.material.dispose(); p.glow.material.dispose(); shots.splice(i, 1); continue; }
    const t = p.target, tp = t.root.position;
    const dx = p.g.position.x - tp.x, dy = p.g.position.y - (tp.y + 1.05), dz = p.g.position.z - tp.z;
    let done = false;
    const rr = 1.0 * Math.max(1, p.sc*0.8);
    const atk = { dmg:p.dmg, kb:p.kb, launch:p.launch, heavy:p.heavy };
    const fx = Math.sin(t.root.rotation.y), fz = Math.cos(t.root.rotation.y);
    const facing = fx*p.vel.x + fz*p.vel.z < 0;   // shot is coming at the defender's front
    const perfect = t.deflectT > 0.14;           // charged blasts need perfect timing
    if (t.hp > 0 && t.deflectT > 0 && facing && dx*dx + dz*dz < (rr + 0.9)*(rr + 0.9) && Math.abs(dy) < 2.2 && (!p.aoe || perfect)){
      // DEFLECT: send it back faster and stronger at whoever threw it
      const prev = p.owner; p.owner = t; p.target = prev;
      const aimAt = new THREE.Vector3(prev.root.position.x, prev.root.position.y + 1.7, prev.root.position.z).sub(p.g.position).normalize();
      p.vel.copy(aimAt).multiplyScalar(p.vel.length());   // same speed it came in at
      p.g.lookAt(p.g.position.clone().add(aimAt));
      p.dmg = Math.round(p.dmg*1.3); p.life = 1.8; p.sc *= 1.1; p.body.scale.setScalar(p.sc);
      if (gameMode === 'online') send({ t:'deflect', sid:p.sid, pos:[p.g.position.x, p.g.position.y, p.g.position.z], vel:[p.vel.x, p.vel.y, p.vel.z], dmg:p.dmg, sc:p.sc, perfect });
      if (!t.remote){ t.deflectT = 0; t.dcd = 0.15; t.busy = 0.1; }
      hitstop = 0.08; shake = Math.max(shake, 0.16);
      spark(p.g.position.clone().setY(p.g.position.y - 1.15), perfect);
      sfx.deflect(perfect); dmgText(t.root.position, perfect ? 'PERFECT!' : 'DEFLECT!', perfect ? '#ffd23f' : '#9fe8ff');
    } else if (t.hp > 0 && t.iframes === 0 && dx*dx + dz*dz < rr*rr && Math.abs(dy) < 1.8*Math.max(1, p.sc*0.7)){
      hit(t, atk, p.vel.clone().setY(0).normalize());
      explode(p.g.position, p.e, true, p.sc); done = true; p.endBig = true;
    } else if (p.life <= 0 || Math.abs(p.g.position.x) > AW/2 - 0.8 || Math.abs(p.g.position.z) > AD/2 - 0.8 || p.g.position.y < 0.3){
      // big charged blasts still catch you in the explosion radius
      if (p.aoe && t.hp > 0 && t.iframes === 0 && Math.hypot(dx, dz) < p.aoe) hit(t, atk, new THREE.Vector3(-dx, 0, -dz).normalize());
      explode(p.g.position, p.e, !!p.aoe, p.sc); done = true; p.endBig = !!p.aoe;
    }
    if (done){ if (gameMode === 'online') send({ t:'shotEnd', sid:p.sid, pos:[p.g.position.x, p.g.position.y, p.g.position.z], big:!!p.endBig }); scene.remove(p.g); p.body.material.dispose(); p.glow.material.dispose(); shots.splice(i, 1); }
  }
  for (let i = rings.length - 1; i >= 0; i--){
    const r = rings[i]; r.t += dt; const k = r.t / r.life;
    if (k >= 1){ scene.remove(r.m); r.m.material.dispose(); if (!r.blast) r.m.geometry.dispose(); rings.splice(i, 1); continue; }
    if (r.blast){ r.m.scale.setScalar(0.6 + r.size*Math.sqrt(k)); r.m.material.uniforms.uTime.value += dt; r.m.material.uniforms.uFade.value = k*1.1; }
    else { r.m.scale.setScalar(0.5 + r.size*k); r.m.material.opacity = 1 - k; }
  }
  for (const p of puffs){
    if (!p.live) continue;
    p.t += dt; const k = p.t / p.life;
    if (k >= 1){ p.live = false; p.m.visible = false; continue; }
    p.m.position.addScaledVector(p.v, dt); p.v.multiplyScalar(1 - dt*2.5);
    p.m.scale.setScalar(p.size * (1 - k*0.85));
    if (p.ramp){ const idx = Math.min(3, Math.floor(k*4.2)); p.m.material.color.setHex(p.ramp[idx]); }   // white -> yellow -> orange -> red bands
    if (k > 0.75) p.m.material.opacity = (1 - k) / 0.25;
  }
}
function separate(){
  const dx = p2.position.x - p1.position.x, dz = p2.position.z - p1.position.z, d = Math.hypot(dx, dz), min = 1.3;
  if (d < min && d > 0.001){ const push = (min - d)/2; p1.position.x -= dx/d*push; p1.position.z -= dz/d*push; p2.position.x += dx/d*push; p2.position.z += dz/d*push; }
}

// ---------- Third-person camera behind Player 1 ----------
let yawOff = 0, pitch = 0.32, camDist = 4.2, dragging = false, lx = 0, ly = 0;
const el = renderer.domElement;
// Mouse: click the game to lock the mouse, then just move it to look (Esc frees it).
// Left click = fireball (tap x3 combo, hold to charge) · right click = deflect.
const mouseBtn = { shoot:false, deflect:false };
let camYaw = null, mouseSens = 1;   // camYaw: free mouse-look yaw while the mouse is locked
try { mouseSens = +localStorage.getItem('ed-sens') || 1; } catch(e){}
addEventListener('keydown', e => {
  if (e.code !== 'BracketLeft' && e.code !== 'BracketRight') return;
  mouseSens = Math.max(0.2, Math.min(3, +(mouseSens * (e.code === 'BracketRight' ? 1.15 : 1/1.15)).toFixed(2)));
  try { localStorage.setItem('ed-sens', mouseSens); } catch(_){}
  document.getElementById('help').textContent = 'Mouse sensitivity: ' + mouseSens.toFixed(2) + '×   ( [ lower · ] higher )';
});
const locked = () => document.pointerLockElement === el;
el.addEventListener('contextmenu', e => e.preventDefault());
el.addEventListener('mousedown', e => {
  if (!gameMode) return;
  if (!locked()){ const r = el.requestPointerLock && el.requestPointerLock({ unadjustedMovement:true }); if (r && r.catch) r.catch(() => el.requestPointerLock()); return; }   // raw mouse input, no OS acceleration   // first click only grabs the mouse
  if (e.button === 0) mouseBtn.shoot = true;
  if (e.button === 2) mouseBtn.deflect = true;
});
addEventListener('mouseup', e => { if (e.button === 0) mouseBtn.shoot = false; if (e.button === 2) mouseBtn.deflect = false; });
document.addEventListener('pointerlockchange', () => { if (!locked()){ mouseBtn.shoot = mouseBtn.deflect = false; } });
el.addEventListener('pointerdown', e => { if (!gameMode && e.pointerType !== 'mouse' || e.pointerType === 'touch'){ dragging = true; lx = e.clientX; ly = e.clientY; } });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (locked()){
    if (Math.abs(e.movementX) > 350 || Math.abs(e.movementY) > 350) return;   // ignore browser jump spikes
    const k = 0.0022 * mouseSens;
    if (camYaw !== null) camYaw -= e.movementX*k; else yawOff -= e.movementX*k;
    pitch += e.movementY*k*0.85; return;
  }
  if (!dragging) return;
  yawOff -= (e.clientX - lx)*0.006; pitch += (e.clientY - ly)*0.004; lx = e.clientX; ly = e.clientY;
});
el.addEventListener('wheel', e => { camDist += e.deltaY*0.005; }, { passive:true });
const camPos = new THREE.Vector3(), lookAt = new THREE.Vector3();
function updateCamera(dt){
  const pad = [...navigator.getGamepads()].find(Boolean);
  if (pad){
    const rx = pad.axes[2]||0, ry = pad.axes[3]||0;
    if (Math.abs(rx) > 0.15) yawOff -= rx*dt*2.5;
    if (Math.abs(ry) > 0.15) pitch += ry*dt*1.5;
    camDist += ((pad.buttons[13]?.pressed?1:0) - (pad.buttons[12]?.pressed?1:0))*dt*6;   // D-pad up/down zoom
    if (pad.buttons[11]?.pressed) { yawOff = 0; pitch = 0.32; } // click right stick to reset
  }
  if (!dragging && !locked() && !(pad && Math.abs(pad.axes[2]||0) > 0.15)) yawOff *= Math.pow(0.15, dt); // drift back behind the player
  pitch = Math.min(1.0, Math.max(-0.3, pitch));   // can tilt the camera upward to aim up
  camDist = Math.min(12, Math.max(3, camDist));
  const mp = (ME || p1f).root.position, tp2 = (THEM || p2f).root.position;
  const base = Math.atan2(mp.x - tp2.x, mp.z - tp2.z);
  // mouse locked = free look like a shooter (camera stays where you point it); otherwise lock-on camera
  if (locked()){ if (camYaw === null) camYaw = base + yawOff; } else if (camYaw !== null){ yawOff = Math.atan2(Math.sin(camYaw - base), Math.cos(camYaw - base)); camYaw = null; }
  if (camYaw !== null && pad && Math.abs(pad.axes[2]||0) > 0.15) camYaw -= (pad.axes[2]||0)*dt*2.5;
  const yaw = camYaw !== null ? camYaw : base + yawOff;
  const target = new THREE.Vector3(
    mp.x + Math.sin(yaw)*Math.cos(pitch)*camDist,
    mp.y + 1.6 + Math.sin(pitch)*camDist,
    mp.z + Math.cos(yaw)*Math.cos(pitch)*camDist);
  // over-the-shoulder offset
  target.x += Math.cos(yaw)*0.9; target.z -= Math.sin(yaw)*0.9;
  // keep the camera inside the arena so it never ends up behind an outer wall
  const CLAMP = AW/2 - 1.4;
  const over = Math.max(Math.abs(target.x) - CLAMP, Math.abs(target.z) - CLAMP, 0);
  target.x = Math.max(-CLAMP, Math.min(CLAMP, target.x));
  target.z = Math.max(-CLAMP, Math.min(CLAMP, target.z));
  target.y += over*0.6;   // lift up a little when squeezed against a wall so the view stays clear
  camPos.lerp(target, 1 - Math.pow(locked() ? 1e-9 : 0.001, dt));   // near-instant follow with the mouse = no lag
  camera.position.copy(camPos);
  if (shake > 0){ shake -= dt; camera.position.x += (Math.random()-0.5)*0.25; camera.position.y += (Math.random()-0.5)*0.25; }
  lookAt.set(mp.x - Math.sin(yaw)*6, 1.3 + mp.y*0.5, mp.z - Math.cos(yaw)*6);
  camera.lookAt(lookAt);
}
camPos.set(p1.position.x, 5, p1.position.z + 6);

// ---------- Controllers ----------
const padsEl = document.getElementById('pads');
function updatePads(){
  const pads = [...navigator.getGamepads()].filter(Boolean);
  padsEl.textContent = pads.length ? pads.map((p,i) => `🎮 P${i+1}: ${p.id.split('(')[0].trim()}`).join('   ')
                                   : 'No controller found – press any button on your controller';
}
addEventListener('gamepadconnected', updatePads);
addEventListener('gamepaddisconnected', updatePads);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- Loop ----------
const clock = new THREE.Clock(); let padTimer = 0;
function loop(){ requestAnimationFrame(loop); try { loopBody(); } catch(err){ console.error(err); } }   // an error can never freeze the game
function loopBody(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const gdt = hitstop > 0 ? dt*0.04 : dt; hitstop = Math.max(0, hitstop - dt);   // freeze-frame on impact
  const inMenu = !gameMode;
  if (inMenu) menuPad();
  // K.O. -> back to the menu
  if (gameMode && (p1f.hp <= 0 || p2f.hp <= 0)){
    if (koTimer === 0){ document.getElementById('ko').style.display = 'block'; sfx.ko(); }
    koTimer += dt;
    if (koTimer > 3){ koTimer = 0; document.getElementById('ko').style.display = 'none'; const wasOnline = gameMode === 'online'; gameMode = null; resetFighters(); showMenu(wasOnline ? 'online' : 'mode'); }
  }
  if (gameMode === 'online'){
    moveFighter(ME, THEM, readInput(0), gdt, true);
    updatePuppet(THEM, gdt);
    netSendT += dt; if (netSendT > 1/30){ netSendT = 0; sendState(); }
  } else {
    moveFighter(p1f, p2f, inMenu ? NO_INPUT : readInput(0), gdt, true);
    moveFighter(p2f, p1f, inMenu ? NO_INPUT : readInput(1), gdt, false);
  }
  separate(); updateSparks(dt); updateWalls(gdt); updateProjectiles(gdt); updateDmg(dt);
  updateCamera(dt); updateAimDot();
  padTimer += dt; if (padTimer > 1) { padTimer = 0; updatePads(); }
  renderer.render(scene, camera);
}
loop();
</script>
</body>
