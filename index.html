<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elemental Duel</title>
<style>
  :root { color-scheme: dark; }
  html, body { height:100%; margin:0; overflow:hidden; background:#9cc8ef; font-family:system-ui, sans-serif; }
  canvas { display:block; touch-action:none; filter:contrast(1.1) saturate(1.2); }
  #hud { position:fixed; inset:0; pointer-events:none;
    padding: calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px); }
  #round { position:absolute; left:50%; top:calc(env(safe-area-inset-top,0px) + 12px); transform:translateX(-50%);
    background:rgba(20,22,30,.75); color:#e8ecf2; padding:6px 16px 4px; border-radius:6px; text-align:center; }
  #round .dots { display:flex; gap:7px; justify-content:center; align-items:center; font-size:12px; }
  #round .dot { width:9px; height:9px; border-radius:50%; border:1.5px solid #e8ecf2; }
  #round .dot.on { background:#e8ecf2; }
  #round .sep { width:2px; height:14px; background:#e8ecf2; margin:0 6px; }
  #round small { display:block; font-size:9px; letter-spacing:.5px; margin-top:3px; opacity:.85; }
  .bar { position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); width:min(32vw,360px); }
  .bar.l { left:16px; } .bar.r { right:16px; text-align:right; }
  .bar b { color:#fff; font-size:14px; text-shadow:0 1px 3px #000; }
  .hp { height:10px; background:rgba(0,0,0,.5); border-radius:3px; margin-top:4px; overflow:hidden; }
  .hp i { display:block; height:100%; width:100%; }
  .l .hp i { background:#e8552e; } .r .hp i { background:#3a9be0; margin-left:auto; }
  .tip { position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); font-size:12px; color:#fff;
    background:rgba(0,0,0,.55); padding:6px 12px; border-radius:14px; white-space:nowrap; }
  #pads { left:16px; } #help { right:16px; }
  #menu { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,12,24,.55);
    font-family:Impact, 'Arial Black', sans-serif; z-index:5; }
  #menu .box { text-align:center; padding:28px 36px; }
  #menu h1 { margin:0 0 6px; font-size:clamp(40px,7vw,78px); color:#fff; letter-spacing:2px;
    -webkit-text-stroke:3px #1a1010; paint-order:stroke fill; text-shadow:4px 4px 0 #e8552e; }
  #menu h2 { margin:0 0 22px; font:600 15px system-ui, sans-serif; color:#dfe8f5; }
  #menu button { display:block; width:260px; margin:10px auto; padding:13px 0; font:22px Impact, 'Arial Black', sans-serif; letter-spacing:1px;
    color:#fff; background:#2a3248; border:3px solid #1a1010; border-radius:10px; cursor:pointer; box-shadow:0 5px 0 #1a1010; transition:transform .06s; }
  #menu button.sel, #menu button:hover { background:#e8552e; transform:translateY(-2px); }
  #menu button:focus-visible { outline:3px solid #ffd23f; outline-offset:3px; }
  #menu input { display:block; width:248px; margin:10px auto; padding:12px 6px; font:20px system-ui, sans-serif; text-align:center;
    border:3px solid #1a1010; border-radius:10px; background:#f4f6fb; color:#1a1010; }
  #menu .status { margin:12px 0 0; font:600 16px system-ui, sans-serif; color:#ffd23f; min-height:20px; }
  #menu .ctl { max-height:58vh; overflow:auto; margin:0 auto 6px; background:rgba(20,24,40,.85); border:3px solid #1a1010; border-radius:10px; }
  #menu table { border-collapse:collapse; font:14px system-ui, sans-serif; color:#eef2fa; text-align:left; }
  #menu th, #menu td { padding:6px 12px; border-bottom:1px solid rgba(255,255,255,.08); white-space:nowrap; }
  #menu th { position:sticky; top:0; background:#e8552e; color:#fff; font-weight:700; }
  #menu td:first-child { font-weight:600; color:#ffd23f; }
  #menu .tips { font:13px system-ui, sans-serif; color:#dfe8f5; text-align:left; max-width:560px; margin:8px auto 0; line-height:1.5; }
  #menu .hint { margin-top:16px; font:13px system-ui, sans-serif; color:#cfd8e6; }
  #ko { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); font:clamp(60px,12vw,140px) Impact, sans-serif; color:#ffd23f;
    -webkit-text-stroke:4px #1a1010; paint-order:stroke fill; display:none; z-index:4; pointer-events:none; }
</style>
</head>
<body>
<div id="hud">
  <div class="bar l"><b>Kaen</b><div class="hp"><i></i></div></div>
  <div id="round"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="sep"></span><span class="dot"></span><span class="dot"></span></div><small>Round 1 · Best of 3</small></div>
  <div class="bar r"><b>Hyoga</b><div class="hp"><i></i></div></div>
  <div id="pads" class="tip">No controller found – press any button on your controller</div>
  <div id="help" class="tip">X×3 combo · Y heavy kick · RT tap×3 fire combo · hold RT charge · LT wall · LB deflect · B roll · A jump</div>
</div>
<div id="ko">K.O.</div>
<div id="menu"><div class="box">
  <h1>ELEMENTAL DUEL</h1>
  <h2 id="menuSub">Choose a mode</h2>
  <div id="menuBtns"></div>
  <div class="hint">Stick / D-pad to choose · A to select · B to go back</div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias:true });
// supersample: render above screen resolution then downscale = crisp edges
renderer.setPixelRatio(Math.min(2, Math.max(1.6, devicePixelRatio)));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// ---------- Sound effects (synthesized live with Web Audio, no files) ----------
const sfx = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { const n = () => {}; return { shot:n, boom:n, hit:n, swing:n, deflect:n, clash:n, whoosh:n, jump:n, charge:n, ko:n, click:n, unlock:n }; }
  const ctx = new AC();
  const master = ctx.createGain(); master.gain.value = 0.55;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 6;
  master.connect(comp); comp.connect(ctx.destination);
  let muted = false;
  addEventListener('keydown', e => { if (e.code === 'KeyM' && document.activeElement.tagName !== 'INPUT'){ muted = !muted; master.gain.value = muted ? 0 : 0.55; } });
  const unlock = () => { if (ctx.state !== 'running') ctx.resume(); };
  ['pointerdown','keydown','touchstart'].forEach(ev => addEventListener(ev, unlock));
  const nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  { const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
  const T = () => ctx.currentTime;
  function env(g, t, a, peak, dur){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function noise({ dur=0.2, type='lowpass', f0=1000, f1=f0, q=1, vol=0.3, a=0.005, delay=0 }){
    if (muted) return; const t = T() + delay;
    const src = ctx.createBufferSource(); src.buffer = nbuf; src.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ctx.createGain(); env(g, t, a, vol, dur);
    src.connect(fl); fl.connect(g); g.connect(master); src.start(t, Math.random()*0.5); src.stop(t + dur + 0.05);
  }
  function tone({ type='sine', f0=440, f1=f0, dur=0.2, vol=0.2, a=0.004, delay=0, lp=0 }){
    if (muted) return; const t = T() + delay;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ctx.createGain(); env(g, t, a, vol, dur);
    let out = o; if (lp){ const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); out = fl; }
    out.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  const charges = new Map();
  return {
    unlock,
    shot(el, sc = 1){
      if (el === 'fire'){
        noise({ dur:0.28*sc, type:'bandpass', f0:900, f1:260, q:0.8, vol:0.32 });
        tone({ type:'sawtooth', f0:150, f1:60, dur:0.22*sc, vol:0.1, lp:600 });
      } else {
        noise({ dur:0.18*sc, type:'highpass', f0:3500, f1:6000, vol:0.13 });
        tone({ type:'sine', f0:1700, f1:2500, dur:0.12, vol:0.08 });
        tone({ type:'triangle', f0:2600, f1:2400, dur:0.25, vol:0.05, delay:0.03 });
      }
    },
    boom(sc = 1, big){
      const k = Math.min(2, sc);
      noise({ dur:0.35*k + (big ? 0.15 : 0), type:'lowpass', f0:1600, f1:160, vol:big ? 0.5 : 0.32, a:0.003 });
      tone({ type:'sine', f0:110, f1:38, dur:0.3*k, vol:big ? 0.45 : 0.25 });
    },
    hit(heavy){
      noise({ dur:0.06, type:'bandpass', f0:1800, f1:900, q:1.2, vol:0.35, a:0.002 });
      tone({ type:'sine', f0:heavy ? 140 : 190, f1:heavy ? 42 : 80, dur:heavy ? 0.2 : 0.09, vol:0.5, a:0.002 });
      if (heavy){ noise({ dur:0.25, type:'lowpass', f0:900, f1:120, vol:0.3, delay:0.01 }); tone({ type:'square', f0:70, f1:40, dur:0.15, vol:0.08, lp:300 }); }
    },
    swing(heavy){ noise({ dur:heavy ? 0.2 : 0.12, type:'bandpass', f0:heavy ? 400 : 700, f1:heavy ? 1300 : 1800, q:1.5, vol:heavy ? 0.2 : 0.13, a:0.02 }); },
    deflect(perfect){
      tone({ type:'triangle', f0:1400, f1:1350, dur:0.35, vol:0.16 });
      tone({ type:'sine', f0:2100, f1:2050, dur:0.45, vol:0.1 });
      if (perfect) tone({ type:'sine', f0:2800, f1:2800, dur:0.6, vol:0.08, delay:0.04 });
      noise({ dur:0.05, type:'highpass', f0:5000, vol:0.18, a:0.001 });
    },
    clash(){
      noise({ dur:0.5, type:'lowpass', f0:1200, f1:100, vol:0.45 });
      tone({ type:'sine', f0:90, f1:35, dur:0.45, vol:0.4 });
      noise({ dur:1.1, type:'highpass', f0:2500, f1:5000, vol:0.16, a:0.05, delay:0.05 });   // steam hiss
    },
    whoosh(){ noise({ dur:0.28, type:'lowpass', f0:350, f1:1000, vol:0.14, a:0.04 }); },
    jump(){ tone({ type:'sine', f0:220, f1:440, dur:0.12, vol:0.06 }); noise({ dur:0.1, type:'lowpass', f0:500, f1:900, vol:0.06 }); },
    charge(f, level){
      let c = charges.get(f);
      if (level < 0 || muted){ if (c){ c.g.gain.setTargetAtTime(0.0001, T(), 0.04); c.o.stop(T() + 0.2); c.n.stop(T() + 0.2); charges.delete(f); } return; }
      if (!c){
        const o = ctx.createOscillator(), g = ctx.createGain(), n = ctx.createBufferSource(), nf = ctx.createBiquadFilter(), ng = ctx.createGain();
        o.type = 'sawtooth'; const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
        n.buffer = nbuf; n.loop = true; nf.type = 'bandpass'; nf.Q.value = 2; ng.gain.value = 0.5;
        g.gain.value = 0.0001; g.gain.setTargetAtTime(0.06, T(), 0.08);
        o.connect(lp); lp.connect(g); n.connect(nf); nf.connect(ng); ng.connect(g); g.connect(master); o.start(); n.start();
        c = { o, g, n, nf }; charges.set(f, c);
      }
      c.o.frequency.setTargetAtTime(80 + level*160, T(), 0.05);
      c.nf.frequency.setTargetAtTime(500 + level*2500, T(), 0.05);
      c.g.gain.setTargetAtTime(0.05 + level*0.06, T(), 0.05);
    },
    ko(){
      tone({ type:'sawtooth', f0:110, f1:55, dur:1.4, vol:0.2, lp:500 });
      tone({ type:'sine', f0:220, f1:110, dur:1.2, vol:0.15 });
      noise({ dur:0.8, type:'lowpass', f0:800, f1:80, vol:0.35 });
    },
    click(){ tone({ type:'square', f0:700, f1:700, dur:0.05, vol:0.04, lp:2500 }); },
    wall(el){
      if (el === 'ice'){ noise({ dur:0.35, type:'highpass', f0:1800, f1:4000, vol:0.25, a:0.01 }); tone({ type:'triangle', f0:900, f1:1600, dur:0.3, vol:0.08 }); tone({ type:'sine', f0:120, f1:60, dur:0.25, vol:0.3 }); }
      else { noise({ dur:0.6, type:'lowpass', f0:300, f1:1400, vol:0.3, a:0.05 }); tone({ type:'sawtooth', f0:70, f1:110, dur:0.5, vol:0.1, lp:400 }); }
    },
    shatter(el){
      if (el === 'ice'){ for (let i = 0; i < 4; i++) tone({ type:'triangle', f0:1800 + Math.random()*1800, f1:1200, dur:0.25, vol:0.06, delay:i*0.03 }); noise({ dur:0.3, type:'highpass', f0:3000, vol:0.25 }); }
      else noise({ dur:0.45, type:'lowpass', f0:1200, f1:150, vol:0.3 });
    },
    sizzle(){ noise({ dur:0.15, type:'highpass', f0:3000, f1:2000, vol:0.08 }); }
  };
})();

const mat = (color, o={}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness:0.85 }, o));
function add(m, parent=scene, cast=true){ m.castShadow = cast; m.receiveShadow = true; parent.add(m); return m; }
function canvasTex(w, h, draw, rx=1, ry=1){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}

// ---------- Sky ----------
const skyTex = canvasTex(8, 256, (g, w, h) => {
  const lg = g.createLinearGradient(0,0,0,h);
  lg.addColorStop(0,'#1f6fe0'); lg.addColorStop(0.55,'#7cc3ff'); lg.addColorStop(1,'#e6f6ff');
  g.fillStyle = lg; g.fillRect(0,0,w,h);
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.MeshBasicMaterial({ map:skyTex, side:THREE.BackSide, fog:false })));


// ---------- Lighting: bright daylight ----------
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x6a6058, 0.32));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.05);
sun.position.set(30, 55, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-35, right:35, top:35, bottom:-35, far:150 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02;
scene.add(sun);

// ---------- Courtyard ----------
const AW = 48, AD = 48, WH = 10;
const slabTex = canvasTex(512, 512, (g, w) => {
  g.fillStyle = '#4c5563'; g.fillRect(0,0,w,w);
  for (let y=0;y<4;y++) for (let x=0;x<4;x++){
    const v = 118 + Math.random()*26;
    g.fillStyle = `rgb(${v-6},${v},${v+10})`; g.fillRect(x*128+2, y*128+2, 124, 124);
    for (let k=0;k<300;k++){ g.fillStyle = `rgba(60,70,80,${Math.random()*0.06})`; g.fillRect(x*128+Math.random()*124, y*128+Math.random()*124, 2, 2); }
  }
}, AW/8, AD/8);
const floor = add(new THREE.Mesh(new THREE.PlaneGeometry(AW, AD), mat(0xffffff, { map:slabTex, roughness:0.9 })), scene, false);
floor.rotation.x = -Math.PI/2;

const plasterTex = canvasTex(256, 256, (g, w) => {
  g.fillStyle = '#b89e94'; g.fillRect(0,0,w,w);
  for (let i=0;i<5000;i++){ g.fillStyle = `rgba(${Math.random()<.5?90:220},${Math.random()<.5?70:200},70,${Math.random()*0.05})`; g.fillRect(Math.random()*w, Math.random()*w, 3, 3); }
}, 6, 1.5);
const wallMat = mat(0xffffff, { map:plasterTex, roughness:0.95 });
const capMat = mat(0x8a7468);
function wall(len, x, z, rotY){
  const g = new THREE.Group();
  const w = add(new THREE.Mesh(new THREE.BoxGeometry(len, WH, 1.2), wallMat), g); w.position.y = WH/2;
  const cap = add(new THREE.Mesh(new THREE.BoxGeometry(len+0.6, 0.5, 1.6), capMat), g); cap.position.y = WH + 0.25;
  const base = add(new THREE.Mesh(new THREE.BoxGeometry(len, 0.6, 1.4), mat(0x7e6c62)), g); base.position.y = 0.3;
  g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
}
wall(AW, 0, -AD/2, 0); wall(AW, 0, AD/2, 0);
wall(AD, -AW/2, 0, Math.PI/2); wall(AD, AW/2, 0, Math.PI/2);

// Tall narrow banners on the walls
function bannerTex(bg, glyph){
  return canvasTex(64, 256, (g, w, h) => {
    g.fillStyle = '#d8b34a'; g.fillRect(0,0,w,h);
    g.fillStyle = bg; g.fillRect(6,6,w-12,h-12);
    g.strokeStyle = '#f2ead8'; g.lineWidth = 5; g.lineCap = 'round'; glyph(g, w, h);
  });
}
const glyphs = {
  air:  (g) => { g.beginPath(); g.moveTo(14,60); g.bezierCurveTo(30,30,40,80,52,50); g.stroke(); },
  fire: (g) => { g.beginPath(); g.moveTo(32,150); g.quadraticCurveTo(14,120,30,80); g.quadraticCurveTo(34,110,46,118); g.quadraticCurveTo(50,140,32,150); g.stroke(); },
  earth:(g) => { g.strokeRect(20,110,24,24); },
  water:(g) => { g.beginPath(); g.moveTo(14,130); g.quadraticCurveTo(24,115,32,130); g.quadraticCurveTo(40,145,50,130); g.stroke(); }
};
const banners = [['#1d3a6b','air'],['#2f5a2a','earth'],['#8a1f17','fire'],['#1d4f7a','water']];
function banner(x, z, rotY, i){
  const [bg, gl] = banners[i % 4];
  const b = add(new THREE.Mesh(new THREE.PlaneGeometry(1.6, 6.4), mat(0xffffff, { map:bannerTex(bg, glyphs[gl]), roughness:1, side:THREE.DoubleSide })), scene, false);
  b.position.set(x, 6.2, z); b.rotation.y = rotY;
}
let bi = 0;
for (let x=-18; x<=18; x+=9) { banner(x, -AD/2+0.62, 0, bi++); banner(x, AD/2-0.62, Math.PI, bi++); }
for (let z=-14; z<=14; z+=14) { banner(-AW/2+0.62, z, Math.PI/2, bi++); banner(AW/2-0.62, z, -Math.PI/2, bi++); }

// Green stone blocks / benches along the back wall (cover)
const greenStone = mat(0x3f6150, { roughness:0.8 });
[[-10,-21,4,1.6,2],[-4,-21,2,3.2,2],[4,-20.5,3,2.2,3],[11,-21,2,3.6,2],[-20,8,2,2.4,3],[20,-6,2,2.8,3]].forEach(([x,z,w,h,d]) => {
  const b = add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d), greenStone)); b.position.set(x, h/2, z);
});

// Covered gallery roof over one corner (like the reference)
(function gallery(){
  const g = new THREE.Group(), wood = mat(0x6a4a34);
  const roof = add(new THREE.Mesh(new THREE.BoxGeometry(18, 0.6, 8), mat(0x4a5a6a, { roughness:0.6 })), g); roof.position.set(0, 9.6, 0);
  [-8,0,8].forEach(x => { const p = add(new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.4,9.4,12), wood), g); p.position.set(x, 4.7, 3.5); });
  g.position.set(14, 0, -AD/2 + 4.6); scene.add(g);
})();

// Spectator stands rising behind the walls
const crowdTex = canvasTex(256, 64, (g, w, h) => {
  g.fillStyle = '#7a6a5e'; g.fillRect(0,0,w,h);
  const cols = ['#c0392b','#2c3e50','#e6c86e','#4a7a5a','#8e5ea2','#d9d0c4','#2f6db0'];
  for (let i=0;i<220;i++){ g.fillStyle = cols[i%cols.length]; g.fillRect(Math.random()*w, Math.random()*h, 3, 5); }
}, 6, 1);
function stands(x, z, rotY, len){
  const g = new THREE.Group();
  for (let r=0;r<6;r++){
    const tier = add(new THREE.Mesh(new THREE.BoxGeometry(len, 1.6, 2.4), [mat(0x8a7a6e),mat(0x8a7a6e),mat(0xffffff,{map:crowdTex}),mat(0x8a7a6e),mat(0xffffff,{map:crowdTex}),mat(0x8a7a6e)]), g, false);
    tier.position.set(0, WH - 2 + r*1.6, -r*2.4);
  }
  g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
}
stands(0, -AD/2 - 2.5, 0, AW+8);
stands(AW/2 + 2.5, 0, -Math.PI/2, AD+8);
stands(-AW/2 - 2.5, 0, Math.PI/2, AD+8);
stands(0, AD/2 + 2.5, Math.PI, AW+8);

// ---------- Anime cel-shading: toon materials + ink outlines on everything ----------
const GRAD = (() => { const t = new THREE.DataTexture(new Uint8Array([95,95,95,255, 175,175,175,255, 255,255,255,255]), 3, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
function toToon(m, skinned){
  if (!m || m.isMeshBasicMaterial || m.isSpriteMaterial || m.isPointsMaterial) return m;
  const t = new THREE.MeshToonMaterial({ color:m.color ? m.color.clone() : new THREE.Color(0xffffff), map:m.map||null, gradientMap:GRAD,
    side:m.side, transparent:m.transparent, opacity:m.opacity, skinning:!!skinned,

const inkCache = {};
function inkMat(thick, skinned){
  const key = thick + (skinned ? 's' : '');
  if (inkCache[key]) return inkCache[key];
  const m = new THREE.MeshBasicMaterial({ color:0x15110e, side:THREE.BackSide, skinning:!!skinned });
  m.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>',
    '#include <project_vertex>\n  vec3 inkObjN = normal;\n#ifdef USE_SKINNING\n  mat4 inkSM = bindMatrixInverse * (skinWeight.x*boneMatX + skinWeight.y*boneMatY + skinWeight.z*boneMatZ + skinWeight.w*boneMatW) * bindMatrix;\n  inkObjN = (inkSM * vec4(normal, 0.0)).xyz;\n#endif\n  vec3 inkN = normalize(normalMatrix * inkObjN);\n  gl_Position.xy += normalize(inkN.xy + 1e-4) * ' + thick.toFixed(4) + ' * gl_Position.w * vec2(1.0, 1.6);'); };

function toonify(root){
  const add = [];
  root.traverse(o => {
    if (!o.isMesh || o.userData.noToon) return;
    o.material = Array.isArray(o.material) ? o.material.map(x => toToon(x)) : toToon(o.material);
    const g = o.geometry;
    if (g.type === 'PlaneGeometry' || g.type === 'RingGeometry' || g.type === 'CircleGeometry' || (g.boundingSphere || (g.computeBoundingSphere(), g.boundingSphere)).radius > 60) return;
    add.push(o);

  add.forEach(o => { const ink = new THREE.Mesh(o.geometry, inkMat(0.006)); ink.userData.noToon = true; o.add(ink); });
}

function play(f, name, fade=0.15, restart=false){

  if (f.cur && f.cur !== name) f.actions[f.cur].crossFadeTo(next, fade, false);
  f.cur = name;
}

const ai = { mode:'approach', t:0, side:1, last:performance.now(), pulse:{}, dodged:new WeakSet(), hold:0 };
function aiInput(){
  const now = performance.now(), dt = Math.min(0.05, (now - ai.last)/1000); ai.last = now;
  const out = { x:0, y:0, jump:false, roll:false, punch:false, kick:false, shoot:false, deflect:false, wall:false };
  if (!p2f.ready || !p1f.ready || p2f.hp <= 0 || p1f.hp <= 0) return out;
  const d = Math.hypot(p1.position.x - p2.position.x, p1.position.z - p2.position.z);
  const tap = k => { if (!ai.pulse[k]) { out[k] = true; } ai.pulse[k] = !ai.pulse[k]; };
  ai.t -= dt;
  if (ai.t <= 0){
    const r = Math.random();
    if (d > 10)      ai.mode = r < 0.45 ? 'shoot' : r < 0.6 ? 'charge' : 'approach';
    else if (d > 3.2) ai.mode = r < 0.35 ? 'approach' : r < 0.65 ? 'shoot' : 'strafe';
    else             ai.mode = r < 0.6 ? 'melee' : r < 0.75 ? 'heavy' : r < 0.9 ? 'retreat' : 'strafe';
    ai.t = AIL.think*(0.6 + Math.random()*0.8); ai.side = Math.random() < 0.5 ? -1 : 1; ai.hold = 0;
  }
  // dodge incoming fireballs sometimes
  for (const s of shots){
    if (s.owner !== p1f || ai.dodged.has(s)) continue;
    const dx = s.g.position.x - p2.position.x, dz = s.g.position.z - p2.position.z;
    if (dx*dx + dz*dz < 40){ ai.dodged.add(s); const r = Math.random();
      if (r < AIL.deflect){ out.deflect = true; return out; }
      if (r < AIL.deflect + AIL.wall && p2f.wcd === 0){ out.wall = true; return out; }
      if (r < AIL.deflect + AIL.dodge){ out.roll = true; out.x = ai.side; return out; } }
  }
  switch (ai.mode){
    case 'approach': out.y = -1; out.x = ai.side*0.35; break;
    case 'retreat':  out.y = 1;  out.x = ai.side*0.5; if (Math.random() < 0.03) tap('shoot'); break;
    case 'strafe':   out.x = ai.side; out.y = d > 6 ? -0.3 : 0.2; if (Math.random() < 0.04) tap('shoot'); break;
    case 'shoot':    out.x = ai.side*0.6; if (Math.random() < AIL.shoot) tap('shoot'); break;
    case 'charge':   ai.hold += dt; out.shoot = ai.hold < 1.1; if (!out.shoot) ai.t = 0; break;
    case 'melee':    out.y = d > 2 ? -1 : 0; if (d < 2.6 && Math.random() < AIL.melee) tap('punch'); break;
    case 'heavy':    out.y = d > 2 ? -1 : 0; if (d < 2.6) { tap('kick'); ai.t = Math.min(ai.t, 0.3); } break;
  }
  if (Math.random() < 0.004) out.jump = true;
  return out;
}

let NET = null, ME = null, THEM = null, netSendT = 0, netSearch = 0;
const LOBBY = 'elementalduel-apg-v1-';
function netStatus(t){ const el = document.getElementById('netStatus'); if (el) el.textContent = t; }
function netStop(){
  netSearch++;

  NET = null;
}
function send(m){ if (NET && NET.conn && NET.conn.open) NET.conn.send(m); }
function findMatch(){
  if (typeof Peer === 'undefined'){ netStatus('Online play needs the hosted version of the game.'); return; }
  const inp = document.getElementById('nameIn');
  const name = (inp && inp.value.trim()) || 'Player';
  try { localStorage.setItem('ed-name', name); } catch(e){}
  if (inp) inp.blur();
  sfx.unlock(); netStop();
  const my = netSearch;
  netStatus('Searching for an opponent…');
  (async () => {
    for (let k = 0; k < 8; k++){
      if (my !== netSearch) return;
      const r = await tryHost(k, name, my);
      if (r === 'host') return;              // waiting in this lobby
      if (my !== netSearch) return;
      if (await tryJoin(k, name, my)) return; // matched as guest
    }
    if (my === netSearch) netStatus('Could not reach the match server. Check your internet and try again.');
  })();
}
function tryHost(k, name, my){
  return new Promise(res => {
    const peer = new Peer(LOBBY + k, { debug:0 });
    let done = false;
    peer.on('open', () => {
      if (my !== netSearch){ peer.destroy(); return res('stop'); }
      done = true; NET = { peer, host:true, name, opp:'', conn:null };
      netStatus('Waiting for an opponent… share this link with a friend!');
      res('host');
    });
    peer.on('connection', conn => {
      if (!NET || NET.peer !== peer || NET.conn){ conn.on('open', () => { conn.send({ t:'busy' }); setTimeout(() => conn.close(), 300); }); return; }
      NET.conn = conn;
      conn.on('open', () => wireConn(conn));
    });
    peer.on('error', err => {
      if (!done){ done = true; peer.destroy(); res(err.type === 'unavailable-id' ? 'taken' : 'error'); }
      else if (NET && NET.peer === peer && !NET.conn) netStatus('Connection problem: ' + err.type);
    });
    setTimeout(() => { if (!done){ done = true; peer.destroy(); res('error'); } }, 8000);
  });
}
function tryJoin(k, name, my){
  return new Promise(res => {
    const peer = new Peer({ debug:0 });
    let done = false;
    const fail = () => { if (!done){ done = true; try { peer.destroy(); } catch(e){} res(false); } };
    peer.on('open', () => {
      if (my !== netSearch) return fail();
      const conn = peer.connect(LOBBY + k, { serialization:'json', reliable:true });
      conn.on('data', m => {
        if (done) return;
        if (m.t === 'busy') return fail();
        if (m.t === 'welcome'){
          done = true; NET = { peer, host:false, name, opp:m.name, conn };
          wireConn(conn, true); send({ t:'hello', name }); res(true);
          beginOnline();
        }
      });
      conn.on('open', () => conn.send({ t:'join', name }));
    });
    peer.on('error', fail);
    setTimeout(fail, 6000);
  });
}
function wireConn(conn, isGuest){
  conn.on('data', onNet);
  conn.on('close', () => {
    if (gameMode === 'online'){ gameMode = null; resetFighters(); showMenu('online'); netStatus('Your opponent left the match.'); }

}

const remoteShots = new Map(), myWalls = new Map();
function onNet(m){
  if (!NET) return;
  switch (m.t){
    case 'join': if (NET.host){ NET.opp = m.name; send({ t:'welcome', name:NET.name }); beginOnline(); } break;
    case 'hello': NET.opp = m.name; break;
    case 's': THEM.net = m; break;
    case 'shoot': {
      const pos = new THREE.Vector3(...m.pos), dir = new THREE.Vector3(...m.dir);
      shoot(THEM, ME, pos, dir, Object.assign({}, m.opt, { sid:m.sid, remote:true }));
      break;
    }
    case 'shotEnd': {
      const i = shots.findIndex(s => s.sid === m.sid);
      if (i >= 0){ const p = shots[i]; p.g.position.set(...m.pos); explode(p.g.position, p.e, m.big, p.sc); killShot(p); shots.splice(i, 1); }
      break;
    }
    case 'deflect': {
      const p = shots.find(s => s.sid === m.sid); if (!p) break;
      const prev = p.owner; p.owner = p.target; p.target = prev;
      p.g.position.set(...m.pos); p.vel.set(...m.vel); p.g.lookAt(p.g.position.clone().add(p.vel));
      p.dmg = m.dmg; p.sc = m.sc; p.body.scale.setScalar(p.sc); p.life = 1.8;
      hitstop = 0.08; shake = Math.max(shake, 0.16); spark(p.g.position.clone().setY(p.g.position.y - 1.9), m.perfect);
      sfx.deflect(m.perfect); dmgText(p.owner.root.position, m.perfect ? 'PERFECT!' : 'DEFLECT!', m.perfect ? '#ffd23f' : '#9fe8ff');
      break;
    }
    case 'clash': {
      const a = shots.find(s => s.sid === m.a), b = shots.find(s => s.sid === m.b);
      if (a && b){ clash(a, b); } [a, b].forEach(p => { if (p){ killShot(p); shots.splice(shots.indexOf(p), 1); } });
      break;
    }
    case 'hit': hit(ME, m.atk, new THREE.Vector3(...m.dir)); break;
    case 'wall': createWall(THEM, new THREE.Vector3(...m.n), new THREE.Vector3(...m.c), m.wid); break;
    case 'wallHit': { const w = walls.find(w => w.wid === m.wid); if (w){ w.hp -= 1; w.flash = 0.1; } break; }
  }
}

function updatePuppet(f, dt){
  const m = f.net; if (!f.ready){ return; }
  if (m){
    const k = 1 - Math.exp(-18*dt);
    f.root.position.x += (m.p[0] - f.root.position.x)*k; f.root.position.y += (m.p[1] - f.root.position.y)*k; f.root.position.z += (m.p[2] - f.root.position.z)*k;
    let d = m.r - f.root.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); f.root.rotation.y += d*k;
    if (m.a && (m.a !== f.cur || m.n !== f.lastN)){ f.lastN = m.n; const before = f.animN; play(f, m.a, 0.08, true); f.animN = before; }
    if (f.cur && f.actions[f.cur]) f.actions[f.cur].setEffectiveTimeScale(m.ts || 1);
    if (m.hp !== f.hp){ f.hp = m.hp; f.hpEl.style.width = f.hp + '%'; }
    f.iframes = m.i ? 1 : 0; f.deflectT = m.d; f.down = !!m.dn;
    f.charging = m.ch >= 0; f.charge = Math.max(0, m.ch);
  }
  f.shield.visible = f.deflectT > 0;
  if (f.shield.visible){ const kk = Math.min(1, f.deflectT / 0.28); f.shield.material.opacity = 0.35*kk; f.shield.rim.material.opacity = 0.9*kk; }
  f.aura.scale.setScalar(1 + (f.charging ? f.charge*0.8 : 0));
  if (f.flash > 0){ f.flash -= dt; if (f.flash <= 0) f.mats.forEach(mm => mm.emissive && mm.emissive.setHex(0x000000)); }
  sfx.charge(f, f.charging && f.hp > 0 ? f.charge : -1);
  f.mixer.update(dt);

      sfx.deflect(perfect); dmgText(t.root.position, perfect ? 'PERFECT!' : 'DEFLECT!', perfect ? '#ffd23f' : '#9fe8ff');
    } else if (t.hp > 0 && t.iframes === 0 && dx*dx + dz*dz < rr*rr && Math.abs(dy) < 1.8*Math.max(1, p.sc*0.7)){
      hit(t, atk, p.vel.clone().setY(0).normalize());
      explode(p.g.position, p.e, true, p.sc); done = true; p.endBig = true;
    } else if (p.life <= 0 || Math.abs(p.g.position.x) > AW/2 - 0.8 || Math.abs(p.g.position.z) > AD/2 - 0.8 || p.g.position.y < 0.3){
      // big charged blasts still catch you in the explosion radius
      if (p.aoe && t.hp > 0 && t.iframes === 0 && Math.hypot(dx, dz) < p.aoe) hit(t, atk, new THREE.Vector3(-dx, 0, -dz).normalize());
      explode(p.g.position, p.e, !!p.aoe, p.sc); done = true; p.endBig = !!p.aoe;
    }
    if (done){ if (gameMode === 'online') send({ t:'shotEnd', sid:p.sid, pos:[p.g.position.x, p.g.position.y, p.g.position.z], big:!!p.endBig }); scene.remove(p.g); p.body.material.dispose(); p.glow.material.dispose(); shots.splice(i, 1); }
  }
  for (let i = rings.length - 1; i >= 0; i--){
    const r = rings[i]; r.t += dt; const k = r.t / r.life;
    if (k >= 1){ scene.remove(r.m); r.m.material.dispose(); if (!r.blast) r.m.geometry.dispose(); rings.splice(i, 1); continue; }
    if (r.blast){ r.m.scale.setScalar(0.6 + r.size*Math.sqrt(k)); r.m.material.uniforms.uTime.value += dt; r.m.material.uniforms.uFade.value = k*1.1; }
    else { r.m.scale.setScalar(0.5 + r.size*k); r.m.material.opacity = 1 - k; }
  }
  for (const p of puffs){
    if (!p.live) continue;
    p.t += dt; const k = p.t / p.life;
    if (k >= 1){ p.live = false; p.m.visible = false; continue; }
    p.m.position.addScaledVector(p.v, dt); p.v.multiplyScalar(1 - dt*2.5);
    p.m.scale.setScalar(p.size * (1 - k*0.85));
    if (p.ramp){ const idx = Math.min(3, Math.floor(k*4.2)); p.m.material.color.setHex(p.ramp[idx]); }   // white -> yellow -> orange -> red bands
    if (k > 0.75) p.m.material.opacity = (1 - k) / 0.25;
  }
}
function separate(){
  const dx = p2.position.x - p1.position.x, dz = p2.position.z - p1.position.z, d = Math.hypot(dx, dz), min = 1.3;
  if (d < min && d > 0.001){ const push = (min - d)/2; p1.position.x -= dx/d*push; p1.position.z -= dz/d*push; p2.position.x += dx/d*push; p2.position.z += dz/d*push; }
}

// ---------- Third-person camera behind Player 1 ----------
let yawOff = 0, pitch = 0.32, camDist = 5.5, dragging = false, lx = 0, ly = 0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  yawOff -= (e.clientX - lx)*0.006; pitch += (e.clientY - ly)*0.004; lx = e.clientX; ly = e.clientY;
});
el.addEventListener('wheel', e => { camDist += e.deltaY*0.005; }, { passive:true });
const camPos = new THREE.Vector3(), lookAt = new THREE.Vector3();
function updateCamera(dt){
  const pad = [...navigator.getGamepads()].find(Boolean);
  if (pad){
    const rx = pad.axes[2]||0, ry = pad.axes[3]||0;
    if (Math.abs(rx) > 0.15) yawOff -= rx*dt*2.5;
    if (Math.abs(ry) > 0.15) pitch += ry*dt*1.5;
    camDist += ((pad.buttons[13]?.pressed?1:0) - (pad.buttons[12]?.pressed?1:0))*dt*6;   // D-pad up/down zoom
    if (pad.buttons[11]?.pressed) { yawOff = 0; pitch = 0.32; } // click right stick to reset
  }
  if (!dragging && !(pad && Math.abs(pad.axes[2]||0) > 0.15)) yawOff *= Math.pow(0.15, dt); // drift back behind the player
  pitch = Math.min(1.0, Math.max(0.05, pitch));
  camDist = Math.min(12, Math.max(3, camDist));
  const mp = (ME || p1f).root.position, tp2 = (THEM || p2f).root.position;
  const base = Math.atan2(mp.x - tp2.x, mp.z - tp2.z);
  const yaw = base + yawOff;
  const target = new THREE.Vector3(
    mp.x + Math.sin(yaw)*Math.cos(pitch)*camDist,
    mp.y + 2.4 + Math.sin(pitch)*camDist,
    mp.z + Math.cos(yaw)*Math.cos(pitch)*camDist);
  // over-the-shoulder offset
  target.x += Math.cos(yaw)*0.9; target.z -= Math.sin(yaw)*0.9;
  // keep the camera inside the arena so it never ends up behind an outer wall
  const CLAMP = AW/2 - 1.4;
  const over = Math.max(Math.abs(target.x) - CLAMP, Math.abs(target.z) - CLAMP, 0);
  target.x = Math.max(-CLAMP, Math.min(CLAMP, target.x));
  target.z = Math.max(-CLAMP, Math.min(CLAMP, target.z));
  target.y += over*0.6;   // lift up a little when squeezed against a wall so the view stays clear
  camPos.lerp(target, 1 - Math.pow(0.001, dt));
  camera.position.copy(camPos);
  if (shake > 0){ shake -= dt; camera.position.x += (Math.random()-0.5)*0.25; camera.position.y += (Math.random()-0.5)*0.25; }
  lookAt.set(mp.x - Math.sin(yaw)*6, 2.0 + mp.y*0.5, mp.z - Math.cos(yaw)*6);
  camera.lookAt(lookAt);
}
camPos.set(p1.position.x, 5, p1.position.z + 6);

// ---------- Controllers ----------
const padsEl = document.getElementById('pads');
function updatePads(){
  const pads = [...navigator.getGamepads()].filter(Boolean);
  padsEl.textContent = pads.length ? pads.map((p,i) => `🎮 P${i+1}: ${p.id.split('(')[0].trim()}`).join('   ')
                                   : 'No controller found – press any button on your controller';
}
addEventListener('gamepadconnected', updatePads);
addEventListener('gamepaddisconnected', updatePads);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- Loop ----------
const clock = new THREE.Clock(); let padTimer = 0;
function loop(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const gdt = hitstop > 0 ? dt*0.04 : dt; hitstop = Math.max(0, hitstop - dt);   // freeze-frame on impact
  const inMenu = !gameMode;
  if (inMenu) menuPad();
  // K.O. -> back to the menu
  if (gameMode && (p1f.hp <= 0 || p2f.hp <= 0)){
    if (koTimer === 0){ document.getElementById('ko').style.display = 'block'; sfx.ko(); }
    koTimer += dt;
    if (koTimer > 3){ koTimer = 0; document.getElementById('ko').style.display = 'none'; const wasOnline = gameMode === 'online'; gameMode = null; resetFighters(); showMenu(wasOnline ? 'online' : 'mode'); }
  }
  if (gameMode === 'online'){
    moveFighter(ME, THEM, readInput(0), gdt, true);
    updatePuppet(THEM, gdt);
    netSendT += dt; if (netSendT > 1/30){ netSendT = 0; sendState(); }
  } else {
    moveFighter(p1f, p2f, inMenu ? NO_INPUT : readInput(0), gdt, true);
    moveFighter(p2f, p1f, inMenu ? NO_INPUT : readInput(1), gdt, false);
  }
  separate(); updateSparks(dt); updateWalls(gdt); updateProjectiles(gdt); updateDmg(dt);
  updateCamera(dt);
  padTimer += dt; if (padTimer > 1) { padTimer = 0; updatePads(); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
